sentence=Key and LED matrix I/O for ESP32 over direct GPIO or daisy-chained shift registers.
paragraph=Backend-agnostic bit-table buses (direct GPIO, or 74HC595/74HC165 shift-register chains over SPI), an anti-ghost key-matrix scanner with debounce, and a multiplexed LED matrix with an esp_timer-driven refresh. The scan/refresh logic is pure and hardware-free; only the bus backends and the refresh timer touch the chip.
