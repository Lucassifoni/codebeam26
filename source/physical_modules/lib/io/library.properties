sentence=Analog, encoder, button, gauge, and NFC peripheral units for ESP32 modules.
paragraph=Pure, host-testable conditioning for mixed peripherals — EMA + calibrated analog axes, Gray-code quadrature decoding, and debounced flat button banks over the backend-agnostic bus interfaces in lib/bus, plus a block-granular NFC session with arrival/removal edges and deferred writes above an abstract reader. The pure units run on the host under test; the ledc gauge output and the MFRC522 I2C reader are the only Arduino backends.
